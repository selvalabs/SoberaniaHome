<svg xmlns="http://www.w3.org/2000/svg" width="480" height="840" viewBox="360 0 480 840" role="img" aria-labelledby="title desc">
  <title id="title">Monitor Comunitário — prévia de alerta no celular</title>
  <desc id="desc">Mockup demonstrativo de uma notificação sobre desligamento programado, hoje das 14h às 17h, para um endereço fictício. Não representa uma entrega real de notificação.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#f0f4f3"/><stop offset="1" stop-color="#e6eeec"/></linearGradient>
    <linearGradient id="wallpaper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e9e7"/><stop offset=".55" stop-color="#b6cdca"/><stop offset="1" stop-color="#719b92"/></linearGradient>
    <linearGradient id="case" x2="1" y2="1"><stop stop-color="#495953"/><stop offset=".35" stop-color="#182b28"/><stop offset="1" stop-color="#40524b"/></linearGradient>
    <filter id="phone-shadow" x="-50%" y="-20%" width="200%" height="150%"><feDropShadow dx="0" dy="20" stdDeviation="19" flood-color="#253c33" flood-opacity=".22"/></filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dy="8" stdDeviation="8" flood-color="#264e46" flood-opacity=".12"/></filter>
    <clipPath id="screen"><rect x="411" y="48" width="378" height="716" rx="43"/></clipPath>
  </defs>
  <rect width="1200" height="840" fill="url(#paper)"/>
  <ellipse cx="600" cy="779" rx="225" ry="17" fill="#b9c9c0" opacity=".38"/>
  <g filter="url(#phone-shadow)">
    <rect x="394" y="195" width="5" height="46" rx="2" fill="#35473f"/><rect x="394" y="257" width="5" height="69" rx="2" fill="#35473f"/><rect x="801" y="224" width="5" height="93" rx="2" fill="#35473f"/>
    <rect x="399" y="34" width="402" height="744" rx="57" fill="url(#case)"/>
    <rect x="403" y="38" width="394" height="736" rx="53" fill="#101c1a" stroke="#7c8c83" stroke-width="1"/>
    <g clip-path="url(#screen)">
      <rect x="411" y="48" width="378" height="716" fill="url(#wallpaper)"/>
      <path d="M355 770C365 456 563 413 824 478L839 800Z" fill="#83a99e" opacity=".45"/>
      <path d="M357 784C445 582 674 555 831 645L846 800Z" fill="#517f70" opacity=".28"/>
      <path d="M430 778C455 626 653 479 780 567" fill="none" stroke="#e2eeea" stroke-width="2" opacity=".33"/>
    </g>
    <rect x="538" y="61" width="124" height="27" rx="14" fill="#111e1c"/><circle cx="644" cy="74" r="5" fill="#263b35"/>
    <g fill="#244a43" font-family="Arial, Helvetica, sans-serif">
      <text x="434" y="83" font-size="13" font-weight="700">13:42</text>
      <g transform="translate(722 70)"><rect width="24" height="12" rx="3" fill="none" stroke="#244a43" stroke-width="1.4"/><rect x="2" y="2" width="18" height="8" rx="1"/><rect x="25" y="4" width="2" height="4" rx="1"/></g>
      <path d="M696 73Q704 65 712 73M699 76Q704 71 709 76" fill="none" stroke="#244a43" stroke-width="1.5" stroke-linecap="round"/><circle cx="704" cy="80" r="1.5"/>
      <path d="M592 117v-5a8 8 0 0 1 16 0v5" fill="none" stroke="#345950" stroke-width="2"/><rect x="588" y="116" width="24" height="19" rx="5" fill="#345950"/>
      <text x="600" y="178" text-anchor="middle" font-size="18">Segunda-feira, 5 de outubro</text>
      <text x="600" y="263" text-anchor="middle" font-size="85" font-weight="300" letter-spacing="-5">13:42</text>
    </g>
    <g filter="url(#card-shadow)">
      <rect x="428" y="303" width="344" height="239" rx="25" fill="#f9fcfb" fill-opacity=".97" stroke="#eaf1ee"/>
      <rect x="446" y="322" width="29" height="29" rx="8" fill="#146b74"/>
      <path d="M454 342h13l-2-3v-5a4.5 4.5 0 0 0-9 0v5zM459 345h3" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" fill="none"/>
      <g font-family="Arial, Helvetica, sans-serif" fill="#193d38">
        <text x="483" y="340" font-size="15" font-weight="700">Monitor Comunitário</text><text x="751" y="339" font-size="11" text-anchor="end" fill="#617973">agora</text>
        <text x="446" y="379" font-size="21" font-weight="700" letter-spacing="-.5">Desligamento programado</text>
        <text x="446" y="409" font-size="18">Hoje, das 14h às 17h</text>
        <text x="446" y="437" font-size="15" fill="#46655f">Rua das Araucárias · Jardim</text>
        <text x="446" y="463" font-size="13" fill="#617973">Um aviso para o seu endereço.</text>
        <path d="M446 479H754" stroke="#d7e5de"/>
        <text x="446" y="513" font-size="16" font-weight="700" fill="#146b74">Ver detalhes do aviso</text><path d="M734 502l8 6-8 6M721 508h21" fill="none" stroke="#146b74" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    <g fill="#e5efeb" stroke="#42675b" stroke-width="1.7"><circle cx="453" cy="710" r="20"/><circle cx="747" cy="710" r="20"/><path d="M449 702h8l-2 12h-4z" fill="none"/><path d="M739 705h5l2-3h4l2 3h4v12h-17z" fill="none"/><circle cx="748" cy="711" r="3" fill="none"/></g>
    <rect x="541" y="746" width="118" height="4" rx="2" fill="#325548" opacity=".65"/>
