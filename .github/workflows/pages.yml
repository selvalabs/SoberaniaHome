name: Publicar no GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag anotada de uma release revisada e integrada em main'
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Identidade e preflight da release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/main
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test -z "$(git status --porcelain)"
          echo "GitHub Pages / selvalabs.github.io/SoberaniaHome / $(git rev-parse HEAD) / $RELEASE_TAG"
          df -h .
          echo 'Site estático completo: sem banco, migração, IA externa ou VPS. Checkout limpo; rollback v0.1.3 pelo mesmo workflow.'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Identificar formato da release
        id: edition
        run: |
          if test -f scripts/package-pages.mjs; then
            echo 'format=astro' >> "$GITHUB_OUTPUT"
            echo 'artifact=.edition-builds/pages-artifact' >> "$GITHUB_OUTPUT"
          else
            echo 'format=legacy' >> "$GITHUB_OUTPUT"
            echo 'artifact=.pages-release' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Dependências e auditoria Python
        run: |
          python -m pip install -r requirements-pages.txt pip-audit==2.10.1
          python -m playwright install --with-deps chromium
          python -m pip_audit -r requirements-pages.txt

      - name: Validar e empacotar edição completa
        if: steps.edition.outputs.format == 'astro'
        env:
          BUILD_DIR: .edition-builds/pages-source
          PUBLIC_SITE_URL: https://selvalabs.github.io/
          PUBLIC_BASE_PATH: /SoberaniaHome/
          PUBLIC_INDEXABLE: 'true'
          PUBLIC_EDGE_AI: 'false'
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          npm ci
          npm audit --audit-level=low
          npm run check
          npm test
          npm run build
          node scripts/package-pages.mjs .edition-builds/pages-source .edition-builds/pages-artifact
          node scripts/check-pages.mjs .edition-builds/pages-artifact
          python scripts/run-browser-tests.py --directory .edition-builds/pages-artifact --base /SoberaniaHome/ --suite pages

      - name: Empacotar edição anterior para rollback
        if: steps.edition.outputs.format == 'legacy'
        run: |
          node --check site/motion.js
          node --check site/public-preview.js
          python tools/build_pages_release.py
          python tests/test_pages_release.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.edition.outputs.artifact }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
