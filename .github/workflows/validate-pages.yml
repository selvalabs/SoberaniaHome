name: Validar edição experimental
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/34-immersive-edition]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependências de validação
        run: |
          python -m pip install -r requirements-pages.txt pip-audit==2.10.1
          python -m playwright install --with-deps chromium
          npm ci
      - name: Auditoria de dependências
        run: |
          python -m pip_audit -r requirements-pages.txt
          npm audit --audit-level=low
      - name: Tipos, política de publicação e Worker
        run: |
          npm run check
          npm test
          git diff --check
      - name: Build estática de prévia
        env:
          BUILD_DIR: .edition-builds/ci
          PUBLIC_INDEXABLE: 'false'
        run: |
          npm run build
          node scripts/check-static.mjs .edition-builds/ci
      - name: Navegação, animações, privacidade e rolagem interna
        run: |
          python -m http.server 4361 --bind 127.0.0.1 --directory .edition-builds/ci > /tmp/soberania-preview.log 2>&1 &
          python tests/test_motion_edition.py --url http://127.0.0.1:4361/
          python tests/test_leaf_flow.py --url http://127.0.0.1:4361/
          python tests/test_horizontal_viewports.py --url http://127.0.0.1:4361/
          python tests/test_project_galleries.py --url http://127.0.0.1:4361/
          python tests/test_site_edition.py --url http://127.0.0.1:4361/
          python tests/test_landing_touch.py --url http://127.0.0.1:4361/
          python tests/test_atelier_edge_ui.py --url http://127.0.0.1:4361/
