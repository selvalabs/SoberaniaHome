name: Validar edição experimental
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/34-immersive-edition]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependências de validação
        run: |
          python -m pip install -r requirements-pages.txt pip-audit==2.10.1
          python -m playwright install --with-deps chromium
          npm ci
      - name: Auditoria de dependências
        run: |
          python -m pip_audit -r requirements-pages.txt
          npm audit --audit-level=low
      - name: Tipos, política de publicação e Worker
        run: |
          npm run check
          npm test
          git diff --check
      - name: Build estática de prévia
        env:
          BUILD_DIR: .edition-builds/ci
          PUBLIC_INDEXABLE: 'false'
        run: |
          npm run build
          node scripts/check-static.mjs .edition-builds/ci
      - name: Navegação, animações, privacidade e rolagem interna
        run: |
          python scripts/run-browser-tests.py --directory .edition-builds/ci
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Dependências
        run: |
          npm ci
          python -m pip install -r requirements-pages.txt
          python -m playwright install --with-deps chromium
      - name: Build pública e pacote no prefixo real
        env:
          BUILD_DIR: .edition-builds/pages-source
          PUBLIC_SITE_URL: https://selvalabs.github.io/
          PUBLIC_BASE_PATH: /SoberaniaHome/
          PUBLIC_INDEXABLE: 'true'
          PUBLIC_EDGE_AI: 'false'
          RELEASE_TAG: v0.2.0
        run: |
          npm run build
          node scripts/package-pages.mjs .edition-builds/pages-source .edition-builds/pages-artifact
          node scripts/check-pages.mjs .edition-builds/pages-artifact
          python scripts/run-browser-tests.py --directory .edition-builds/pages-artifact --base /SoberaniaHome/ --suite pages
