<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor Comunitário — alerta no WhatsApp</title><link rel="stylesheet" href="styles.css?v=whatsapp-5"></head><body>
<main><div class="phone"><div class="screen">
<div class="status"><span>13:42</span><span class="island"></span><span class="system-icons"><svg viewBox="0 0 40 15" aria-hidden="true"><path d="M1 13h3V9H1zm6 0h3V6H7zm6 0h3V2h-3z" fill="currentColor"/><path d="M21 4q5-5 10 0m-8 3q3-3 6 0" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="26" cy="10" r="1.2" fill="currentColor"/><rect x="34" y="2" width="5" height="11" rx="1" fill="none" stroke="currentColor"/></svg></span></div>
<header class="chat-head"><span class="back" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></svg></span><span class="avatar" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#dfe7e3"/><circle cx="20" cy="14" r="7" fill="#92a89f"/><path d="M6 34c1-8 6-12 14-12s13 4 14 12" fill="#92a89f"/></svg></span><div class="contact"><strong>Monitor Comunitário</strong></div><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="13" height="13" rx="3"/><path d="m15 9 6-3v11l-6-3Z"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 3 4 4-2 3c1 3 4 6 7 7l3-2 4 4c-2 4-6 4-11 0S1 6 5 3Z"/></svg><span class="dots" aria-hidden="true">⋮</span></header>
<div class="chat"><div class="date">HOJE</div><div class="message-bubble"><div id="message-content"></div><span class="message-time">13:42</span></div></div>
<div class="composer" aria-hidden="true"><div class="input-pill"><svg class="smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M7 14c2 5 8 5 10 0"/><circle cx="8.5" cy="9" r=".8" fill="currentColor"/><circle cx="15.5" cy="9" r=".8" fill="currentColor"/></svg><span>Mensagem</span><svg viewBox="0 0 24 24"><path d="m9 16 7-7c4-4 8 0 4 4l-9 9c-6 5-12-1-7-7L14 5c2-2 5 1 3 3l-9 9"/></svg><svg viewBox="0 0 24 24"><path d="M2 7h5l2-3h6l2 3h5v13H2Z"/><circle cx="12" cy="13" r="4"/></svg></div><span class="microphone"><svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v3a7 7 0 0 0 14 0v-3M12 20v3M8 23h8"/></svg></span></div><div class="home-indicator"><span>◁</span><span>○</span><span>□</span></div>
</div></div><p class="note">Texto do envio em produção · nome, endereço e ocorrência ilustrativos</p></main>
<script src="message.js"></script><script>
const content=document.querySelector('#message-content');
function appendFormatted(node,line){
  line.split(/(\*[^*]+\*)/g).forEach(part=>{if(part.startsWith('*')&&part.endsWith('*')){const strong=document.createElement('strong');strong.textContent=part.slice(1,-1);node.append(strong)}else node.append(document.createTextNode(part))});
}
window.MONITOR_MESSAGE.split(/\n{2,}/).forEach((block,index)=>{
  const paragraph=document.createElement('div');paragraph.className='message-paragraph';
  if(index===0)paragraph.classList.add('message-title');
  block.split('\n').forEach((line,i)=>{
    if(i)paragraph.append(document.createElement('br'));
    const match=line.match(/^([📍📅🕒🛠]\s+[^:]+:)(.*)$/u);
    if(match){const label=document.createElement('strong');label.textContent=match[1];paragraph.append(label);appendFormatted(paragraph,match[2])}
    else if(line.startsWith('Olá, ')){const split=line.indexOf('. ');if(split>0){appendFormatted(paragraph,line.slice(0,split+1));paragraph.append(document.createElement('br'));appendFormatted(paragraph,line.slice(split+2))}else appendFormatted(paragraph,line)}
    else appendFormatted(paragraph,line);
  });
  content.append(paragraph);
});
</script></body></html>
